<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Matte Black Background Gradient -->
    <radialGradient id="blackTile" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#222228"/>
      <stop offset="60%" stop-color="#121216"/>
      <stop offset="100%" stop-color="#08080a"/>
    </radialGradient>

    <!-- Rich 3D Gold Metallic Gradient -->
    <linearGradient id="gold3D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF59D"/>
      <stop offset="25%" stop-color="#FFD700"/>
      <stop offset="65%" stop-color="#D4AF37"/>
      <stop offset="90%" stop-color="#AA7C11"/>
      <stop offset="100%" stop-color="#705000"/>
    </linearGradient>

    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDE7"/>
      <stop offset="40%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>

    <!-- Deep Crimson Red Gradient -->
    <linearGradient id="crimsonRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5252"/>
      <stop offset="40%" stop-color="#D32F2F"/>
      <stop offset="85%" stop-color="#8B0000"/>
      <stop offset="100%" stop-color="#4A0000"/>
    </linearGradient>

    <!-- Gold Border Ring Gradient -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE57F"/>
      <stop offset="35%" stop-color="#FFD700"/>
      <stop offset="70%" stop-color="#B8860B"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>

    <!-- 3D Drop Shadows -->
    <filter id="goldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <filter id="flagGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#8B0000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Black Matte Square Tile -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="url(#blackTile)" stroke="#000000" stroke-width="6" />

  <!-- Outer Gold Double Rim Frame -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#goldRim)" stroke-width="8" />
  <rect x="26" y="26" width="460" height="460" rx="86" fill="none" stroke="url(#goldRim)" stroke-opacity="0.4" stroke-width="2" />

  <!-- Main Emblem Assembly -->
  <g filter="url(#goldShadow)">

    <!-- Deep Crimson Inner Backdrop Behind Columns -->
    <path d="M 175 190 C 175 125, 337 125, 337 190 L 390 350 L 122 350 Z" fill="url(#crimsonRed)" opacity="0.9" />

    <!-- Gold Flagpole -->
    <line x1="256" y1="42" x2="256" y2="108" stroke="url(#goldLight)" stroke-width="6" stroke-linecap="round" />
    <circle cx="256" cy="40" r="7" fill="url(#goldLight)" />

    <!-- Waving Crimson Red Flag -->
    <g filter="url(#flagGlow)">
      <path d="M 256 48 C 290 42, 310 68, 350 56 C 352 76, 330 92, 256 86 Z" fill="url(#crimsonRed)" stroke="url(#goldRim)" stroke-width="1.5" />
    </g>

    <!-- Top Gold Dome Knob Base -->
    <circle cx="256" cy="108" r="9" fill="url(#goldLight)" />

    <!-- Main Gold Capitol Dome -->
    <path d="M 190 180 C 190 115, 322 115, 322 180 Z" fill="url(#gold3D)" />
    <path d="M 190 180 C 220 125, 292 125, 322 180 Z" fill="url(#goldLight)" opacity="0.4" />

    <!-- Dome Base Molding Rings -->
    <rect x="172" y="172" width="168" height="14" rx="5" fill="url(#gold3D)" stroke="#5c4000" stroke-width="1" />
    <rect x="156" y="186" width="200" height="12" rx="4" fill="url(#crimsonRed)" />

    <!-- Left Columns -->
    <g fill="url(#gold3D)">
      <!-- Roof Arch Beam Left -->
      <path d="M 108 220 Q 200 200, 215 220 L 215 230 Q 200 210, 108 230 Z" fill="url(#gold3D)" />
      <!-- Pillars -->
      <rect x="118" y="230" width="15" height="105" rx="4" />
      <rect x="142" y="230" width="15" height="105" rx="4" />
      <rect x="166" y="230" width="15" height="105" rx="4" />
      <rect x="190" y="230" width="15" height="105" rx="4" />
      <!-- Left Base Plate -->
      <rect x="110" y="335" width="102" height="12" rx="3" fill="url(#gold3D)" />
    </g>

    <!-- Right Columns -->
    <g fill="url(#gold3D)">
      <!-- Roof Arch Beam Right -->
      <path d="M 297 220 Q 312 200, 404 220 L 404 230 Q 312 210, 297 230 Z" fill="url(#gold3D)" />
      <!-- Pillars -->
      <rect x="307" y="230" width="15" height="105" rx="4" />
      <rect x="331" y="230" width="15" height="105" rx="4" />
      <rect x="355" y="230" width="15" height="105" rx="4" />
      <rect x="379" y="230" width="15" height="105" rx="4" />
      <!-- Right Base Plate -->
      <rect x="300" y="335" width="102" height="12" rx="3" fill="url(#gold3D)" />
    </g>

    <!-- Prominent 3D Gold Capital 'A' Frame -->
    <!-- Left Leg -->
    <path d="M 256 182 L 212 182 L 102 410 Q 96 422, 118 424 L 178 424 L 228 312 L 256 312 Z" fill="url(#goldLight)" stroke="#6d4c00" stroke-width="1.5" />
    <!-- Right Leg -->
    <path d="M 256 182 L 300 182 L 410 410 Q 416 422, 394 424 L 334 424 L 284 312 L 256 312 Z" fill="url(#gold3D)" stroke="#6d4c00" stroke-width="1.5" />
    <!-- Bevel Center Highlight Line -->
    <path d="M 256 182 L 256 312" stroke="#FFFDE7" stroke-width="3" />
    <!-- Horizontal Crossbar -->
    <rect x="196" y="306" width="120" height="22" rx="5" fill="url(#gold3D)" stroke="#5c4000" stroke-width="1" />

    <!-- Assembly Member Silhouettes (Inside Arch of 'A') -->
    <!-- Center Leader -->
    <circle cx="256" cy="358" r="14" fill="url(#goldLight)" />
    <path d="M 234 412 C 234 380, 278 380, 278 412 Z" fill="url(#goldLight)" />

    <!-- Left Member -->
    <circle cx="220" cy="368" r="11" fill="url(#gold3D)" />
    <path d="M 204 412 C 204 386, 236 386, 236 412 Z" fill="url(#gold3D)" />

    <!-- Right Member -->
    <circle cx="292" cy="368" r="11" fill="url(#gold3D)" />
    <path d="M 276 412 C 276 386, 308 386, 308 412 Z" fill="url(#gold3D)" />

    <!-- Crimson Pedestal Arch Curve -->
    <path d="M 85 438 Q 256 418, 427 438 Q 256 428, 85 438 Z" fill="url(#crimsonRed)" />

    <!-- Bottom Gold Curved Accent Line -->
    <path d="M 135 454 Q 256 442, 377 454 Q 256 447, 135 454 Z" fill="url(#goldLight)" />

  </g>
</svg>
